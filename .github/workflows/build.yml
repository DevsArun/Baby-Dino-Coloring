name: Build Baby Dino Coloring APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare android shell (throwaway flutter create + overlay + pem check)
        run: bash ci/prepare_android.sh

      - name: Pub get
        run: flutter pub get

      - name: Analyze (no continue-on-error, fix everything)
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build DEBUG apk (Appetize / emulator testing ONLY)
        run: flutter build apk --debug

      - name: Write release keystore + key.properties from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo '::error::SIGNING_KEYSTORE_BASE64 secret is missing! Add the 4 signing secrets from your signing kit.'
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=../release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          EOF

      - name: Build SIGNED RELEASE apk (never pass --stacktrace here)
        run: flutter build apk --release

      - name: Verify release signature (fail on debug cert / mismatch)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: bash ci/verify_signature.sh

      - name: Clean up signing material
        if: always()
        run: rm -f android/release.jks android/key.properties

      - name: Upload AMAZON-UPLOAD-signed-release (upload THIS one to Amazon)
        uses: actions/upload-artifact@v4
        with:
          name: AMAZON-UPLOAD-signed-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APPETIZE-ONLY-debug (NEVER upload this to Amazon)
        uses: actions/upload-artifact@v4
        with:
          name: APPETIZE-ONLY-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
