name: baby_dino_coloring
description: "Baby Dino Coloring - Tap, color, roar! Easy coloring for toddlers."
publish_to: "none"
version: 1.3.2+12

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  # Pinned exact: stable APIs, no surprise breakage on future Flutter upgrades.
  audioplayers: 6.1.0
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pages/pages.json
    - assets/brand/icon_512.png
    - assets/audio/
